<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | PersonIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark login-page">
<div class="login">
  <div class="brand-top"><div class="brand"><img src="../images/logo.png" alt=""><p class="wordmark">Person<b>IA</b></p></div></div>
  <main class="panel">
    <div class="intro"><h1>Bem-vindo de volta!</h1><p>Seu próximo passo começa aqui.</p></div>
    <form data-validate data-next="inicio.html" novalidate>
      <div class="field"><label for="email">E-mail</label>
        <div class="input"><input id="email" type="email" value="usuario@email.com" autocomplete="email" required><i data-icon="mail"></i></div></div>
      <div class="field"><label for="senha">Senha</label>
        <div class="input"><input id="senha" type="password" value="senha12345" minlength="6" autocomplete="current-password" required>
          <button type="button" class="eye" aria-label="Mostrar ou ocultar senha"><i data-icon="eye-off"></i></button></div></div>
      <a class="forgot" href="#" data-soon>Esqueceu a senha?</a>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p class="signup">Não tem uma conta? <a href="criar-conta.html">Criar conta</a></p>
    <p class="safe"><i data-icon="shield-check"></i>Seus dados estão protegidos</p>
  </main>
</div>
<script src="../js/script.js"></script>
</body>
</html>
