<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objetivos | PersonIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="lav has-nav" data-nav="perfil">
<header class="topbar">
  <a class="back" href="perfil.html" aria-label="Voltar"><i data-icon="arrow-left"></i></a>
  <h1>Objetivos</h1><span></span>
</header>
<main class="screen narrow">
  <div class="intro"><h2>O que você quer melhorar?</h2><p>Escolha um ou mais objetivos. Vamos personalizar sua jornada.</p></div>
  <form id="goals" class="goals" data-ok="Objetivos salvos!"><label class="goal"><input type="checkbox" data-field="goal-saude" checked><span class="ico"><i data-icon="heart-pulse"></i></span><span class="t"><b>Saúde</b><small>Mais energia e qualidade de vida</small></span><span class="chk"><i data-icon="check"></i></span></label><label class="goal"><input type="checkbox" data-field="goal-cond" checked><span class="ico"><i data-icon="dumbbell"></i></span><span class="t"><b>Condicionamento físico</b><small>Ganhar força e resistência</small></span><span class="chk"><i data-icon="check"></i></span></label><label class="goal"><input type="checkbox" data-field="goal-bem" checked><span class="ico"><i data-icon="flower"></i></span><span class="t"><b>Bem-estar</b><small>Cuidar do corpo e da mente</small></span><span class="chk"><i data-icon="check"></i></span></label><label class="goal"><input type="checkbox" data-field="goal-hab"><span class="ico"><i data-icon="repeat"></i></span><span class="t"><b>Hábitos</b><small>Construir uma rotina consistente</small></span><span class="chk"><i data-icon="check"></i></span></label><label class="goal"><input type="checkbox" data-field="goal-sono"><span class="ico"><i data-icon="moon"></i></span><span class="t"><b>Sono</b><small>Dormir melhor e recuperar energia</small></span><span class="chk"><i data-icon="check"></i></span></label><label class="goal"><input type="checkbox" data-field="goal-alim"><span class="ico"><i data-icon="apple"></i></span><span class="t"><b>Alimentação</b><small>Fazer escolhas mais equilibradas</small></span><span class="chk"><i data-icon="check"></i></span></label>
    <p class="count" id="count">3 objetivos selecionados</p>
    <button class="btn" type="submit">Salvar objetivos</button></form>
</main>
<script src="../js/script.js"></script>
</body>
</html>
