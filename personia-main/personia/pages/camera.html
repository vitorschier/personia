<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câmera | PersonIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="home has-nav" data-nav="camera">
  <header class="cam-top"><a class="back plain" href="inicio.html" aria-label="Voltar"><i
        data-icon="chevron-left"></i></a>
    <h1>Full Body</h1>
  </header>
  <main class="screen cam">
    <p class="hint">Posicione-se no centro da tela e inicie a gravação</p>
    <div class="stage" id="stage"><svg viewBox="0 0 374 504" aria-label="Silhueta fazendo um agachamento">
        <defs>
          <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
            <path d="M34 0H0V34" fill="none" stroke="#e4e4e4" stroke-width="1" />
          </pattern>
        </defs>
        <rect width="374" height="504" fill="#d3d3d3" />
        <rect width="374" height="504" fill="url(#g)" />
        <g stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cx="240" cy="132" r="24" fill="#fff" stroke="none" />
          <path d="M222 168L172 262" stroke="#fff" stroke-width="30" />
          <path d="M172 262L258 280L240 384L282 390" stroke="#fff" stroke-width="22" />
          <path d="M222 168L262 214L304 226" stroke="#fff" stroke-width="16" />
          <path d="M222 168L262 214L304 226M222 168L172 262L258 280L240 384L282 390" stroke="#a78bfa"
            stroke-width="5" />
        </g>
        <g fill="#7c3aed" stroke="#fff" stroke-width="3">
          <circle cx="222" cy="168" r="7" />
          <circle cx="262" cy="214" r="7" />
          <circle cx="304" cy="226" r="7" />
          <circle cx="172" cy="262" r="8" />
          <circle cx="258" cy="280" r="8" />
          <circle cx="240" cy="384" r="8" />
        </g>
      </svg></div>
    <div class="ctl">
      <div><button class="sq" id="tips" aria-label="Dicas"><i data-icon="lightbulb"></i></button><span>Dicas</span>
      </div>
      <div><button class="rec" id="rec" aria-label="Iniciar gravação"><span><i
              data-icon="camera"></i></span></button><span id="recLabel">Iniciar gravação</span></div>
      <div><button class="sq" id="flip" aria-label="Virar câmera"><i data-icon="refresh"></i></button><span>Virar
          câmera</span></div>
    </div>
  </main>
  <script src="../js/script.js"></script>
</body>

</html>
